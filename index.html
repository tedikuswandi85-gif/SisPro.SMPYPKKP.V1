<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISPRO v9.5 - Ultimate School Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-[#F3F4F6] text-slate-900" x-data="sisproCore()" x-init="init()">

    <div x-show="!session && !staffMode" class="min-h-screen flex flex-col items-center justify-center p-6 bg-indigo-950">
        <div class="bg-white w-full max-w-2xl rounded-[3rem] p-12 shadow-2xl">
            <h1 class="text-3xl font-black italic text-indigo-900 text-center uppercase">SIS<span class="text-indigo-500">PRO</span> PORTAL</h1>
            <p class="text-center text-slate-400 font-bold text-xs mt-2 uppercase tracking-widest mb-10">Pencarian Data Siswa & Kehadiran</p>
            
            <div class="flex gap-4 mb-8">
                <input type="text" x-model="searchKey" placeholder="Masukkan NISN Siswa..." class="flex-1 bg-slate-50 border-4 border-slate-100 rounded-3xl px-8 py-5 font-bold focus:border-indigo-500 outline-none transition">
                <button @click="searchAnak()" class="bg-indigo-600 text-white px-10 py-5 rounded-3xl font-black uppercase hover:bg-indigo-700 transition shadow-xl">Cari</button>
            </div>

            <template x-if="searchResult">
                <div class="bg-indigo-50 p-8 rounded-[2.5rem] border border-indigo-100 animate-in fade-in zoom-in duration-300">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <p class="text-[10px] font-black text-indigo-400 uppercase">Nama Lengkap</p>
                            <p class="text-2xl font-black text-indigo-900" x-text="searchResult.nama"></p>
                        </div>
                        <span class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-black uppercase" x-text="'Kelas: ' + searchResult.id_kelas"></span>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white p-6 rounded-3xl text-center">
                            <p class="text-[10px] font-black text-slate-400 uppercase">Status Terakhir</p>
                            <p class="text-xl font-black text-emerald-600">Hadir</p>
                        </div>
                        <div class="bg-white p-6 rounded-3xl text-center">
                            <p class="text-[10px] font-black text-slate-400 uppercase">Persentase</p>
                            <p class="text-xl font-black text-slate-800">98%</p>
                        </div>
                    </div>
                </div>
            </template>

            <button @click="staffMode = true" class="w-full mt-12 text-slate-300 font-bold text-[10px] uppercase hover:text-indigo-500 transition">Portal Guru & Admin <i class="fas fa-arrow-right ml-1"></i></button>
        </div>
    </div>

    <div class="flex min-h-screen" x-show="session" x-cloak>
        <aside class="w-72 bg-slate-900 text-white flex flex-col sticky top-0 h-screen shadow-2xl">
            <div class="p-8 flex-1">
                <div class="flex items-center gap-3 mb-12">
                    <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center rotate-3 shadow-lg shadow-indigo-500/50">
                        <i class="fas fa-shield-alt text-white"></i>
                    </div>
                    <span class="font-black text-xl italic uppercase tracking-tighter">SIS<span class="text-indigo-400">PRO</span></span>
                </div>
                <nav class="space-y-1">
                    <button @click="activeTab = 'dashboard'; loadSiswa()" :class="activeTab === 'dashboard' ? 'bg-indigo-600 shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'" class="w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest transition">
                        <i class="fas fa-home w-5"></i> Dashboard
                    </button>
                    <button @click="activeTab = 'manajemen'; loadSiswa()" :class="activeTab === 'manajemen' ? 'bg-indigo-600 shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'" class="w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest transition">
                        <i class="fas fa-user-edit w-5"></i> Manajemen Data
                    </button>
                </nav>
            </div>
            <div class="p-8 border-t border-white/5">
                <p class="text-[10px] font-black text-indigo-400 uppercase mb-2" x-text="session?.user.email"></p>
                <button @click="logout()" class="w-full bg-red-500/10 text-red-500 py-3 rounded-xl font-black text-[10px] uppercase hover:bg-red-500 hover:text-white transition">Sign Out</button>
            </div>
        </aside>

        <main class="flex-1 p-10 overflow-y-auto">
            <header class="flex justify-between items-end mb-10">
                <div>
                    <h2 class="text-4xl font-black text-slate-800 uppercase italic tracking-tighter" x-text="activeTab"></h2>
                    <p class="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-2 uppercase">v9.5 Secure Enterprise Edition</p>
                </div>
                <div class="flex gap-3">
                    <button @click="exportPDF()" class="bg-white border-2 text-slate-600 px-6 py-4 rounded-2xl font-black text-[10px] uppercase hover:shadow-lg transition"><i class="fas fa-file-pdf mr-2 text-rose-500"></i> Export PDF</button>
                    <button @click="$refs.excelFile.click()" class="bg-indigo-600 text-white px-6 py-4 rounded-2xl font-black text-[10px] uppercase shadow-lg shadow-indigo-200 hover:-translate-y-1 transition"><i class="fas fa-file-import mr-2"></i> Bulk Import</button>
                    <input type="file" x-ref="excelFile" @change="importExcel" class="hidden" accept=".xlsx">
                </div>
            </header>

            <div x-show="activeTab === 'manajemen'" class="space-y-8">
                <div class="bg-white p-10 rounded-[2.5rem] border shadow-sm">
                    <h3 class="text-xs font-black uppercase text-indigo-600 mb-6 tracking-widest">Input Siswa Manual</h3>
                    <div class="grid grid-cols-4 gap-4">
                        <input type="text" x-model="form.nisn" placeholder="NISN" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-4 font-bold outline-indigo-500">
                        <input type="text" x-model="form.nama" placeholder="Nama Lengkap" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-4 font-bold outline-indigo-500">
                        <input type="number" x-model="form.id_kelas" placeholder="ID Kelas" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-4 font-bold outline-indigo-500">
                        <button @click="saveManual()" class="bg-indigo-600 text-white rounded-2xl font-black text-[10px] uppercase shadow-xl hover:bg-indigo-700 transition">Simpan Data</button>
                    </div>
                </div>

                <div class="bg-white rounded-[2.5rem] border shadow-sm overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <tr>
                                <th class="px-8 py-6">Informasi Siswa</th>
                                <th class="px-8 py-6">ID Kelas</th>
                                <th class="px-8 py-6 text-center">Kontrol</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            <template x-for="s in listSiswa" :key="s.nisn">
                                <tr class="hover:bg-indigo-50/30 transition group">
                                    <td class="px-8 py-5">
                                        <div class="flex items-center gap-4">
                                            <div class="w-10 h-10 bg-white border-2 border-slate-100 rounded-xl flex items-center justify-center font-black text-indigo-600" x-text="s.nama[0]"></div>
                                            <div>
                                                <p class="font-black text-slate-800" x-text="s.nama"></p>
                                                <p class="text-[10px] font-bold text-slate-400 uppercase" x-text="s.nisn"></p>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-8 py-5">
                                        <span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg font-black text-[9px] uppercase" x-text="'ID: ' + s.id_kelas"></span>
                                    </td>
                                    <td class="px-8 py-5 text-center">
                                        <button @click="deleteSiswa(s.nisn)" class="text-rose-400 hover:text-rose-600 transition"><i class="fas fa-trash-alt"></i></button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div x-show="staffMode && !session" class="fixed inset-0 z-[100] bg-indigo-950 flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md p-12 rounded-[3rem] shadow-2xl relative">
            <button @click="staffMode = false" class="absolute top-8 right-8 text-slate-300 hover:text-slate-800 transition"><i class="fas fa-times-circle text-2xl"></i></button>
            <h2 class="text-3xl font-black text-indigo-900 mb-8 italic uppercase tracking-tighter">Staff Login</h2>
            <div class="space-y-4">
                <input type="email" x-model="auth.email" placeholder="Email Staf" class="w-full bg-slate-50 border-2 rounded-2xl px-6 py-4 font-bold outline-indigo-500">
                <input type="password" x-model="auth.password" placeholder="Password" class="w-full bg-slate-50 border-2 rounded-2xl px-6 py-4 font-bold outline-indigo-500">
                <button @click="login()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black uppercase shadow-xl hover:bg-indigo-700 transition active:scale-95">Masuk Portal</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://rrocxrcvkmnbznkifvzo.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyb2N4cmN2a21uYnpua2lmdnpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MDk0NTYsImV4cCI6MjA5MzM4NTQ1Nn0.eOa6GTEbxoJ0tK-zhan-lUZp9WEd_OqnMQjN7-L4QXY";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        function sisproCore() {
            return {
                session: null, staffMode: false, activeTab: 'dashboard',
                searchKey: '', searchResult: null,
                listSiswa: [], auth: { email: '', password: '' },
                form: { nisn: '', nama: '', id_kelas: '' },

                async init() {
                    const { data: { session } } = await _sb.auth.getSession();
                    this.session = session;
                    if(session) this.loadSiswa();
                },

                // PORTAL ORANG TUA
                async searchAnak() {
                    const { data, error } = await _sb.from('siswa').select('*').eq('nisn', this.searchKey).single();
                    if(data) this.searchResult = data;
                    else alert("Data NISN tidak ditemukan!");
                },

                // DASHBOARD ACTIONS
                async loadSiswa() {
                    const { data } = await _sb.from('siswa').select('*').order('nama');
                    this.listSiswa = data || [];
                },

                async saveManual() {
                    if(!this.form.nisn || !this.form.nama) return alert("Lengkapi Form!");
                    const { error } = await _sb.from('siswa').insert([this.form]);
                    if(!error) {
                        alert("Data Tersimpan!");
                        this.form = { nisn: '', nama: '', id_kelas: '' };
                        this.loadSiswa();
                    } else { alert("Gagal Simpan: " + error.message); }
                },

                // IMPORT & EXPORT
                importExcel(e) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = async (evt) => {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                        const { error } = await _sb.from('siswa').insert(data);
                        if(!error) { alert("Berhasil Import!"); this.loadSiswa(); }
                        else { alert("Gagal Import! Periksa Nama Kolom Excel: nisn, nama, id_kelas"); }
                    };
                    reader.readAsBinaryString(file);
                },

                exportPDF() {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.setFontSize(18);
                    doc.text("Laporan Siswa SISPRO", 14, 20);
                    doc.autoTable({
                        startY: 30,
                        head: [['NISN', 'Nama Siswa', 'ID Kelas']],
                        body: this.listSiswa.map(s => [s.nisn, s.nama, s.id_kelas]),
                        theme: 'grid',
                        headStyles: { fillColor: [79, 70, 229] }
                    });
                    doc.save("DataSiswa.pdf");
                },

                // AUTH
                async login() {
                    const { error } = await _sb.auth.signInWithPassword(this.auth);
                    if(!error) location.reload();
                    else alert("Login Gagal: " + error.message);
                },

                async logout() { await _sb.auth.signOut(); location.reload(); },

                async deleteSiswa(nisn) {
                    if(confirm("Hapus data siswa ini?")) {
                        await _sb.from('siswa').delete().eq('nisn', nisn);
                        this.loadSiswa();
                    }
                }
            }
        }
    </script>
</body>
</html>

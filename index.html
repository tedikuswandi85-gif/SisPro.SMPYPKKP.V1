<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISPRO v7.0 - Integrated School System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-50 font-sans" x-data="schoolApp()" x-init="initApp()">

    <template x-if="!userSession">
        <div class="fixed inset-0 bg-indigo-950 flex items-center justify-center p-6 z-[100]">
            <div class="bg-white w-full max-w-md p-10 rounded-[40px] shadow-2xl">
                <h2 class="text-3xl font-black text-center text-indigo-900 mb-8 italic">SISPRO LOGIN</h2>
                <div class="space-y-4">
                    <input type="email" x-model="loginEmail" placeholder="Email Staf" class="w-full border-2 rounded-2xl px-6 py-4 font-bold outline-indigo-500 transition focus:bg-white">
                    <input type="password" x-model="loginPassword" placeholder="Password" class="w-full border-2 rounded-2xl px-6 py-4 font-bold outline-indigo-500 transition focus:bg-white">
                    <button @click="handleLogin()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest hover:bg-indigo-700 transition">Akses Sistem</button>
                </div>
                <p class="text-center text-slate-400 text-[10px] mt-6 font-bold uppercase tracking-widest italic">Protected by Supabase Auth</p>
            </div>
        </div>
    </template>

    <div class="flex min-h-screen" x-show="userSession" x-cloak>
        <aside class="w-72 bg-indigo-950 text-white flex flex-col sticky top-0 h-screen shadow-2xl overflow-y-auto">
            <div class="p-8">
                <div class="flex items-center gap-3 mb-10">
                    <div class="bg-yellow-400 p-2 rounded-xl"><i class="fas fa-graduation-cap text-indigo-950 text-xl"></i></div>
                    <h1 class="font-black text-2xl tracking-tighter italic uppercase">SIS<span class="text-yellow-400">PRO</span></h1>
                </div>
                <nav class="space-y-1">
                    <template x-for="menu in sidebarMenus">
                        <button x-show="!isPustakawan() || ['dashboard', 'perpustakaan'].includes(menu.id)"
                                @click="activeTab = menu.id" 
                                :class="activeTab === menu.id ? 'bg-white/10 text-yellow-400 border-l-4 border-yellow-400' : 'text-slate-400 border-l-4 border-transparent'"
                                class="w-full flex items-center gap-4 px-6 py-4 font-black text-[10px] uppercase tracking-widest transition hover:text-white">
                            <i :class="menu.icon" class="w-5 text-center text-sm"></i>
                            <span x-text="menu.label"></span>
                        </button>
                    </template>
                </nav>
            </div>
            <div class="mt-auto p-8 border-t border-white/5 bg-black/20 text-center">
                <p class="text-[9px] text-yellow-400 uppercase font-black mb-3" x-text="isPustakawan() ? 'Role: Pustakawan' : 'Role: Administrator'"></p>
                <button @click="handleLogout()" class="w-full bg-red-500/10 text-red-500 py-3 rounded-xl font-black text-[10px] uppercase hover:bg-red-500 hover:text-white transition">Logout</button>
            </div>
        </aside>

        <main class="flex-1 p-10 overflow-y-auto">
            <header class="flex justify-between items-center mb-10">
                <h2 class="text-4xl font-black text-slate-800 italic uppercase tracking-tighter" x-text="getCurrentMenuLabel()"></h2>
                <div class="bg-white px-6 py-3 rounded-2xl shadow-sm border font-black text-[10px] uppercase tracking-widest text-indigo-600" x-text="todayDate"></div>
            </header>

            <div x-show="activeTab === 'dashboard'" class="space-y-10">
                <div class="grid grid-cols-2 gap-8">
                    <div class="bg-white p-10 rounded-[40px] border shadow-sm h-80 flex flex-col">
                        <h4 class="font-black text-slate-400 text-[10px] uppercase tracking-[0.2em] mb-4">Statistik Kehadiran</h4>
                        <div class="flex-1"><canvas id="absensiPieChart"></canvas></div>
                    </div>
                    <div class="bg-white p-10 rounded-[40px] border shadow-sm h-80 flex flex-col">
                        <h4 class="font-black text-slate-400 text-[10px] uppercase tracking-[0.2em] mb-4">Rata-rata Nilai</h4>
                        <div class="flex-1"><canvas id="nilaiBarChart"></canvas></div>
                    </div>
                </div>
            </div>

            <div x-show="activeTab === 'siswa'" class="bg-white rounded-[40px] border shadow-sm overflow-hidden">
                <div class="p-8 border-b bg-slate-50/50 flex justify-between items-center">
                    <input type="text" x-model="searchSiswa" placeholder="Cari Siswa..." class="bg-white border rounded-xl px-5 py-3 text-sm font-bold w-72 outline-indigo-500">
                    <button class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-black text-[10px] uppercase">+ Tambah Siswa</button>
                </div>
                <table class="w-full text-left">
                    <thead class="bg-white border-b text-[10px] font-black text-slate-400 uppercase tracking-widest">
                        <tr><th class="px-8 py-6">Nama Siswa</th><th class="px-8 py-6">Kelas</th><th class="px-8 py-6">Orang Tua</th><th class="px-8 py-6 text-center">Aksi</th></tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <template x-for="s in filteredSiswa" :key="s.nisn">
                            <tr class="hover:bg-slate-50 transition">
                                <td class="px-8 py-4 font-bold text-slate-700" x-text="s.nama"></td>
                                <td class="px-8 py-4"><span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg font-black text-[10px]" x-text="s.kelas"></span></td>
                                <td class="px-8 py-4 text-xs font-bold text-slate-400" x-text="s.no_wa_ortu || '-'"></td>
                                <td class="px-8 py-4 text-center">
                                    <template x-if="s.no_wa_ortu">
                                        <a :href="'https://wa.me/' + formatPhone(s.no_wa_ortu)" target="_blank" class="bg-emerald-500 text-white p-2 rounded-lg hover:bg-emerald-600 transition"><i class="fab fa-whatsapp"></i></a>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <div x-show="activeTab === 'perpustakaan'" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-indigo-600 p-8 rounded-[35px] text-white shadow-xl shadow-indigo-100">
                        <p class="text-[10px] font-black opacity-60 uppercase mb-1">Total Buku</p>
                        <p class="text-3xl font-black" x-text="dataBuku.length"></p>
                    </div>
                </div>
                <div class="bg-white rounded-[40px] border shadow-sm overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <tr><th class="px-8 py-6">Judul Buku</th><th class="px-8 py-6">ISBN</th><th class="px-8 py-6">Kategori</th><th class="px-8 py-6 text-center">Stok</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <template x-for="b in dataBuku" :key="b.id">
                                <tr class="hover:bg-slate-50 transition">
                                    <td class="px-8 py-4 font-black text-slate-700 text-sm" x-text="b.judul"></td>
                                    <td class="px-8 py-4 text-xs text-slate-400 font-mono" x-text="b.isbn"></td>
                                    <td class="px-8 py-4 uppercase text-[10px] font-black text-indigo-500" x-text="b.kategori"></td>
                                    <td class="px-8 py-4 text-center font-black" x-text="b.stok"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script>
        const SB_URL = "https://rrocxrcvkmnbznkifvzo.supabase.co"; 
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyb2N4cmN2a21uYnpua2lmdnpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MDk0NTYsImV4cCI6MjA5MzM4NTQ1Nn0.eOa6GTEbxoJ0tK-zhan-lUZp9WEd_OqnMQjN7-L4QXY";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        function schoolApp() {
            return {
                userSession: null, activeTab: 'dashboard',
                loginEmail: '', loginPassword: '',
                dataSiswa: [], dataBuku: [], searchSiswa: '',
                todayDate: new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
                sidebarMenus: [
                    { id: 'dashboard', label: 'Dashboard', icon: 'fas fa-th-large' },
                    { id: 'siswa', label: 'Data Siswa', icon: 'fas fa-user-graduate' },
                    { id: 'perpustakaan', label: 'Perpustakaan', icon: 'fas fa-book' },
                    { id: 'pengumuman', label: 'Pengumuman', icon: 'fas fa-bullhorn' }
                ],
                async initApp() {
                    const { data: { session } } = await _supabase.auth.getSession();
                    this.userSession = session?.user || null;
                    if(this.userSession) {
                        this.fetchAllData();
                        this.initCharts();
                    }
                },
                async handleLogin() {
                    const { data, error } = await _supabase.auth.signInWithPassword({ email: this.loginEmail, password: this.loginPassword });
                    if (error) alert("Gagal login: " + error.message); else location.reload();
                },
                handleLogout() { _supabase.auth.signOut(); location.reload(); },
                async fetchAllData() {
                    let { data: s } = await _supabase.from('students').select('*').order('nama'); this.dataSiswa = s || [];
                    let { data: b } = await _supabase.from('books').select('*').order('judul'); this.dataBuku = b || [];
                },
                get filteredSiswa() {
                    return this.dataSiswa.filter(s => s.nama.toLowerCase().includes(this.searchSiswa.toLowerCase()));
                },
                isPustakawan() { return this.userSession?.email.includes('pustaka'); },
                formatPhone(p) { return p.startsWith('0') ? '62' + p.slice(1) : p; },
                initCharts() {
                    this.$nextTick(() => {
                        new Chart(document.getElementById('absensiPieChart'), { type: 'doughnut', data: { labels: ['Hadir', 'Izin', 'Alpa'], datasets: [{ data: [90, 5, 5], backgroundColor: ['#6366f1', '#fbbf24', '#ef4444'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom' } } } });
                        new Chart(document.getElementById('nilaiBarChart'), { type: 'bar', data: { labels: ['7A', '7B', '8A', '8B', '9A', '9B'], datasets: [{ label: 'Rata-rata', data: [82, 79, 85, 80, 88, 84], backgroundColor: '#6366f1', borderRadius: 10 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
                    });
                },
                getCurrentMenuLabel() { return this.sidebarMenus.find(m => m.id === this.activeTab)?.label; }
            }
        }
    </script>
</body>
</html>
